name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Reads @digitaplatform/* deps (e.g. theme) from GitHub Packages during install.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitaplatform'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm -r build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
