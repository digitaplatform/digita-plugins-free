name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The Release workflow commits a release with GITHUB_TOKEN, and GitHub starts no workflow from such
  # a push. This runs the build after every release as well; for this event the checkout is the head
  # of master, which is the release commit. Packages are published only by the Release workflow's
  # publish job.
  workflow_run:
    workflows: [Release]
    types: [completed]

# Reads @digitaplatform/* deps (e.g. theme) from GitHub Packages during install.
permissions:
  contents: read
  packages: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@digitaplatform'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm -r build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm -r test
